<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Fondo circular Obsidian -->
  <circle cx="50" cy="50" r="50" fill="#262628"/>

  <!-- Pétalos (5 elipses rotadas alrededor del centro) -->
  <ellipse cx="50" cy="22" rx="11" ry="16" fill="#C6C2F2" transform="rotate(0 50 50)"/>
  <ellipse cx="50" cy="22" rx="11" ry="16" fill="#C6C2F2" transform="rotate(72 50 50)"/>
  <ellipse cx="50" cy="22" rx="11" ry="16" fill="#C6C2F2" transform="rotate(144 50 50)"/>
  <ellipse cx="50" cy="22" rx="11" ry="16" fill="#C6C2F2" transform="rotate(216 50 50)"/>
  <ellipse cx="50" cy="22" rx="11" ry="16" fill="#C6C2F2" transform="rotate(288 50 50)"/>

  <!-- Centro de la flor -->
  <circle cx="50" cy="50" r="14" fill="#C6C2F2"/>

  <!-- Cabeza -->
  <circle cx="50" cy="27" r="9" fill="#C6C2F2"/>

  <!-- Patitas -->
  <ellipse cx="44" cy="71" rx="4.5" ry="7" fill="#C6C2F2" transform="rotate(-10 44 71)"/>
  <ellipse cx="56" cy="71" rx="4.5" ry="7" fill="#C6C2F2" transform="rotate(10 56 71)"/>
</svg>
